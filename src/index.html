<!doctype html>
<!-- lang="ja": the product's first language. It decides line-breaking rules,
     which face the browser picks for CJK, and what a screen reader speaks. -->
<html lang="ja">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>J.H AI Agent</title>

    <!-- Apply the persisted theme BEFORE the stylesheet paints (light is the
         default; dashboard.css's bare :root is dark, so set data-theme early
         to avoid a dark flash on startup). main.js re-applies + syncs later. -->
    <script>
      try {
        if (localStorage.getItem('jhai_theme') !== 'dark') document.documentElement.dataset.theme = 'light';
      } catch (e) { document.documentElement.dataset.theme = 'light'; }

      // Turn on the bamboo theme's cursors. Set HERE rather than in main.js
      // because a cursor that arrives after first paint visibly swaps under the
      // pointer. cursors.css also requires data-theme="bamboo-ancient", so this
      // attribute is inert under every other theme and can always be set.
      // '' means "leave the system cursors alone".
      try {
        // Validated against the sets cursors.css actually defines. A stale or
        // hand-edited value would otherwise set an attribute that matches no
        // rule, and the theme would silently show system cursors with nothing
        // to indicate why. '' is the one legitimate way to ask for that.
        var SETS = ['bamboo', ''];
        var cs = localStorage.getItem('jhai_cursor');
        if (SETS.indexOf(cs) === -1) cs = 'bamboo';
        if (cs) document.documentElement.dataset.cursor = cs;
      } catch (e) { document.documentElement.dataset.cursor = 'bamboo'; }
    </script>

    <!-- Inter, bundled. No network at startup: see src/styles/fonts.css for
         why the Google Fonts <link> that used to be here went, and what the
         bundle costs (~145KB, latin subset, six weights). -->
    <link rel="stylesheet" href="./styles/fonts.css" />

    <!-- Dashboard Styles -->
    <link rel="stylesheet" href="./styles/dashboard.css" />
    <!-- Pointers for the bamboo-slip theme; inert under the other themes. -->
    <link rel="stylesheet" href="./styles/cursors.css" />
  </head>

  <body>
    <!-- Custom Title Bar (since decorations: false) -->
    <div id="titlebar" data-tauri-drag-region>
      <div class="titlebar-brand" data-tauri-drag-region>
        <svg class="titlebar-icon" viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" xmlns="http://www.w3.org/2000/svg">
          <!-- hexagon body -->
          <path d="M10 2L17 6v8L10 18 3 14V6z"/>
          <!-- inner cross / circuit node -->
          <circle cx="10" cy="10" r="2" fill="currentColor" stroke="none"/>
          <line x1="10" y1="8" x2="10" y2="5.5"/>
          <line x1="10" y1="12" x2="10" y2="14.5"/>
          <line x1="8.3" y1="9" x2="6.2" y2="7.7"/>
          <line x1="11.7" y1="11" x2="13.8" y2="12.3"/>
          <line x1="8.3" y1="11" x2="6.2" y2="12.3"/>
          <line x1="11.7" y1="9" x2="13.8" y2="7.7"/>
        </svg>
        <span class="titlebar-title" data-tauri-drag-region>J.H AI Agent</span>
      </div>
      <div class="titlebar-controls">
        <button id="titlebar-theme" class="titlebar-btn" aria-label="Toggle light/dark theme" title="Toggle light/dark theme">☀</button>
        <button id="titlebar-minimize" class="titlebar-btn" aria-label="Minimize">─</button>
        <button id="titlebar-maximize" class="titlebar-btn" aria-label="Maximize">□</button>
        <button id="titlebar-close" class="titlebar-btn titlebar-btn-close" aria-label="Close">✕</button>
      </div>
    </div>

    <!-- App Root -->
    <div id="app">
      <!-- Sidebar + Content injected by main.js -->
    </div>

    <!-- Main Script -->
    <script type="module" src="./main.js"></script>
  </body>
</html>
